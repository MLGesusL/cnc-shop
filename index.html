<meta charset="utf-8">
<title>CNC Shop Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1f3d2a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c140f" media="(prefers-color-scheme: dark)">
<style>
/* CNC Shop Assistant — forest theme
   Forest green carries the structure (sidebar, primary actions); brown highlights mark what is YOURS:
   your logged data, your current place in the app, your input focus. */
:root{
 --bg:#e9ede7;--card:#f8faf6;--sub:#eef2ec;--tx:#1c2a20;--mu:#56645a;--bd:#cdd6cc;--bd2:#b2bfb1;
 --ink:#234d32;--inktx:#f8faf6;
 --hi:#8a5a2b;--hibg:#f1e6d8;--hiwash:rgba(138,90,43,.08);
 --side:#1f3d2a;--sidetx:#e6eee6;--sidemu:#a7bba9;--sidehi:#d4a26b;--sidehibg:rgba(212,162,107,.16);--sidebd:#2f5240;
 --ac:var(--hi);--ac2:var(--hibg);
 --ok:#2f7a45;--okbg:#e1efe4;--warn:#9a6200;--warnbg:#f6ecd6;--bad:#b3261e;--badbg:#f7e1df;
 --info:#2c5e7a;--infobg:#e1ecf1;--rf:#6a4a8c;--rfbg:#ece6f3;
 --r:4px;--sh:none;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#111a14;--card:#18241c;--sub:#1e2b22;--tx:#e2e9e1;--mu:#9fb0a2;--bd:#2c3b30;--bd2:#3b4d40;
 --ink:#7fb48f;--inktx:#111a14;--hi:#d6a56f;--hibg:#3a2c1d;--hiwash:rgba(214,165,111,.09);
 --side:#0c140f;--sidetx:#dfe8df;--sidemu:#8fa392;--sidehi:#d6a56f;--sidehibg:rgba(214,165,111,.14);--sidebd:#223127;
 --ok:#86c99a;--okbg:#1c3324;--warn:#e7b558;--warnbg:#3a2e14;--bad:#f2948c;--badbg:#3d1d1a;
 --info:#8fc0d8;--infobg:#1d3240;--rf:#c4a8e8;--rfbg:#2e2540;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#111a14;--card:#18241c;--sub:#1e2b22;--tx:#e2e9e1;--mu:#9fb0a2;--bd:#2c3b30;--bd2:#3b4d40;
 --ink:#7fb48f;--inktx:#111a14;--hi:#d6a56f;--hibg:#3a2c1d;--hiwash:rgba(214,165,111,.09);
 --side:#0c140f;--sidetx:#dfe8df;--sidemu:#8fa392;--sidehi:#d6a56f;--sidehibg:rgba(214,165,111,.14);--sidebd:#223127;
 --ok:#86c99a;--okbg:#1c3324;--warn:#e7b558;--warnbg:#3a2e14;--bad:#f2948c;--badbg:#3d1d1a;
 --info:#8fc0d8;--infobg:#1d3240;--rf:#c4a8e8;--rfbg:#2e2540;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 "Barlow",system-ui,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.cond,h1,h2,h3,h4,legend,th,.side nav button,.seg button,.pl button,.sb a,.out b,.gs,details.card>summary{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

/* ---- frame ---- */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);color:var(--sidetx);border-right:1px solid var(--sidebd);padding:18px 0 14px;display:flex;flex-direction:column}
.brand{font:600 20px/1.1 "Barlow Semi Condensed",sans-serif;padding:0 18px 16px;letter-spacing:-.005em}
.brand span{display:block;font-weight:400;color:var(--sidehi)}.brand small{display:block;margin-top:6px;font:400 12px/1.3 "Barlow",sans-serif;color:var(--sidemu)}
.side nav{display:flex;flex-direction:column}
.side nav button{position:relative;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--sidetx);padding:8px 18px;cursor:pointer;font-size:16px;font-weight:500;text-align:left}
.side nav button i{font-style:normal;width:16px;text-align:center;font-size:12px;font-weight:600;color:var(--sidemu);flex:none}
.side nav button:hover{background:rgba(255,255,255,.06)}
.side nav button.on{color:var(--sidehi);font-weight:600;background:var(--sidehibg)}
.side nav button.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--sidehi)}
.side nav button.on i{color:var(--sidehi)}
.side .tag{color:var(--sidetx);border-color:var(--sidebd)}
.side nav .tag{margin-left:auto}
.side .tools{margin-top:auto;padding:12px 14px 0;border-top:1px solid var(--sidebd);display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.1}.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);white-space:nowrap}
.chip.ok::before,.chip.err::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}.chip.err::before{background:var(--bad)}
main{max-width:1240px;margin:0 auto;padding:20px 24px 72px}
.sec{display:none}.sec.on{display:block}

/* ---- panels ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
h2{font-size:20px;font-weight:600;margin:0 0 10px;line-height:1.2}
h3{font-size:16px;font-weight:600;margin:18px 0 6px;color:var(--tx)}
h4{font-size:15px;font-weight:600;margin:16px 0 6px;color:var(--tx)}
h4 .mu{font-family:"Barlow",sans-serif;font-weight:400}
p{max-width:78ch}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--card);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--hi);outline-offset:-1px;border-color:var(--hi)}
textarea{resize:vertical}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
button.b,.b{background:var(--ink);color:var(--inktx);border:1px solid var(--ink);min-height:40px;padding:7px 16px;border-radius:var(--r);cursor:pointer;font:inherit;font-weight:600}
button.b:hover{background:color-mix(in srgb,var(--ink) 86%,var(--hi))}button.b:disabled{opacity:.45;cursor:default}
button.b.s{background:transparent;color:var(--tx);border:1px solid var(--bd2)}button.b.s:hover{border-color:var(--tx);background:var(--sub)}
button.b.sm{min-height:30px;padding:3px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input,.row>select{flex:1;min-width:140px;width:auto}

/* readouts: the one loud thing — big condensed figures like a setup sheet */
.out{display:flex;gap:0;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.out>div{font-size:13px;color:var(--mu);padding:10px 22px 10px 0;margin-right:22px;border-right:1px solid var(--bd);min-width:96px}
.out>div:last-child{border-right:0}
.out b{display:block;font-size:30px;font-weight:600;color:var(--tx);line-height:1.1;letter-spacing:-.01em}
.out input.fxout{display:block;width:9ch;min-width:120px;font:600 30px/1.1 "Barlow Semi Condensed","Barlow",system-ui,sans-serif;color:var(--tx);background:transparent;border:1px dashed transparent;border-radius:6px;padding:0 4px;margin-left:-5px}
.out input.fxout:hover,.out input.fxout:focus{border-color:var(--bd);background:var(--bg)}
.out input.fxout.fxheld{border:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
input.fxsolved{border-color:var(--warn)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 30%,transparent)}
.out>div.fxsolve,.out>div.fxerr{border:0;padding:4px 0;min-width:0}.out>div.fxsolve:empty,.out>div.fxerr:empty{display:none}
.out .fxclr{margin-left:4px;vertical-align:middle}
.out>div.fxsolve b{display:inline;font-size:inherit;font-weight:700;letter-spacing:0}.out>div.fxsolve select{display:inline-block;width:auto;max-width:240px;padding:2px 6px;margin-left:4px}.out>div.fxsolve{flex-basis:100%;margin-right:0}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);margin:6px 0 10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;min-width:52px;vertical-align:top}
th{background:var(--sub);color:var(--mu);font-weight:600;font-size:14px;border-bottom:1px solid var(--bd2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sub)}
td.n,th.n{text-align:right}
td.n b{font-weight:700}
th.own{color:var(--hi);background:var(--hibg)}
td.own,td.own b{color:var(--hi)}td.own{background:var(--hiwash)}
.tx{white-space:pre-wrap!important;word-break:break-word;min-width:200px}

/* chat */
.msg{padding:10px 14px;margin:10px 0;white-space:pre-wrap;word-wrap:break-word;line-height:1.6;max-width:86ch}
.msg.u{border-left:3px solid var(--hi);background:var(--hiwash);margin-left:40px}
.msg.a{border-left:3px solid var(--bd2);background:var(--card)}
.mu{color:var(--mu);font-size:13px}p.mu{margin:6px 0}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:3px;border:1px solid var(--bd2);margin-right:4px;font-weight:500;color:var(--mu);line-height:1.6}
.good{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.pl{margin:10px 0 0;display:flex;gap:4px;flex-wrap:wrap}
.pl button{border:1px solid var(--bd2);background:transparent;color:var(--tx);padding:3px 12px;border-radius:var(--r);cursor:pointer;font-size:15px}
.pl button:hover{background:var(--sub)}.pl button.on{background:var(--ink);color:var(--inktx);border-color:var(--ink)}

/* cheat sheet index */
.cs{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.sb{position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 96px);overflow-y:auto;border-left:1px solid var(--bd)}
.sb a{cursor:pointer;padding:4px 12px;font-size:15px;color:var(--tx);margin-left:-1px;border-left:2px solid transparent}
.sb a:hover{border-left-color:var(--hi);color:var(--hi)}
.sb a.h{font-weight:600;color:var(--mu);font-size:13px;margin-top:12px;cursor:default;pointer-events:none;border-left-color:transparent}
.cs .card,.cs details{scroll-margin-top:80px}
details.card>summary{cursor:pointer;font-weight:600;font-size:19px;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"+";width:14px;color:var(--mu);font-weight:400}
details.card[open]>summary::before{content:"−"}
details.card[open]>summary{margin-bottom:8px}
.gs{font-weight:600;cursor:pointer;padding:8px 0;font-size:19px}
ul{margin:4px 0 0 18px;padding:0}li{margin:3px 0;max-width:80ch}

/* source + severity marks */
.src{display:inline-block;font-size:12px;font-weight:600;padding:0 6px;border-radius:3px;cursor:help;line-height:1.6}
.src.DB{background:var(--hi);color:var(--card)}
.src.CAL{background:var(--infobg);color:var(--info)}
.src.REF{background:var(--rfbg);color:var(--rf)}
.src.TYP,.src.BASE{color:var(--mu);border:1px solid var(--bd2)}
.src.DB-SUB{background:var(--hi);color:var(--card)}.src.DB-SUB-FAM{background:var(--hibg);color:var(--hi);border:1px solid var(--hi)}
.seecuts{border:0;background:none;padding:0;color:var(--info);text-decoration:underline;cursor:pointer;font:inherit}
.src.MFR{background:var(--okbg);color:var(--ok)}
.src.GEM{background:var(--sub);color:var(--ink);border:1px solid var(--ink);cursor:help}
.src.BAND{background:var(--rfbg);color:var(--rf);border:1px solid var(--rf)}
.src.CUTS{background:var(--hi);color:var(--card)}.src.CUS{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
table.gt td.alls{font-size:12px;line-height:1.35;white-space:nowrap;color:var(--mu)}table.gt td.alls b{color:var(--tx);font-weight:600}table.gt td.alls.win{background:var(--hiwash)}
.c6srcs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bd)}.c6srcs button{border:1px solid var(--bd2);background:var(--card);color:var(--tx);border-radius:16px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}.c6srcs button.on{background:var(--ink);color:var(--inktx);border-color:var(--ink)}.c6srcs button[disabled]{opacity:.45;cursor:default}.c6srcs small{opacity:.8;margin-left:4px}
.gemw{cursor:help;color:var(--warn);font-weight:600}
.sev{display:inline-block;font-size:12px;font-weight:600;padding:0 7px;border-radius:3px;line-height:1.6}
.sev.High{background:var(--badbg);color:var(--bad)}.sev.Med{background:var(--warnbg);color:var(--warn)}.sev.Low{background:var(--sub);color:var(--tx)}.sev.Info{color:var(--mu);border:1px solid var(--bd2)}
.note{padding:9px 14px;margin:10px 0;font-size:14px;background:var(--sub);color:var(--tx);border-left:3px solid var(--bd2);max-width:100ch}
.note.w{background:var(--warnbg);border-left-color:var(--warn)}.note.e{background:var(--badbg);border-left-color:var(--bad)}.note.o{background:var(--hiwash);border-left-color:var(--hi)}
.cap{color:var(--warn);font-weight:700;cursor:help}
.ctl{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;color:var(--tx);padding:5px 14px;cursor:pointer;font-size:15px;border-right:1px solid var(--bd2)}
.seg button:last-child{border-right:0}.seg button:hover{background:var(--sub)}
.seg button.on{background:var(--ink);color:var(--inktx);font-weight:600}
/* Bands editor (2026-10-14): material list | cutter-type tables, like hyperMILL's Materials dialog */
.mbw{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;align-items:start}
@media (max-width:900px){.mbw{grid-template-columns:1fr}}
.mbl{border:1px solid var(--bd);border-radius:var(--r);background:var(--card);max-height:70vh;overflow:auto}
.mbl button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);padding:7px 10px;cursor:pointer;font:inherit;font-size:14px}
.mbl button:hover{background:var(--sub)}.mbl button.on{background:var(--hibg);font-weight:600}
.mbl small{color:var(--mu);white-space:nowrap}
.lockbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin:0 0 10px;border:1px solid var(--bd);border-left:4px solid var(--warn);border-radius:var(--r);background:var(--warnbg);font-size:14px}
.lockbar.on{border-left-color:var(--ok);background:var(--okbg)}.lockbar .mu{flex:1 1 260px}
.islocked input:disabled,.islocked select:disabled,.islocked textarea:disabled{border-color:transparent!important;background:transparent!important;color:var(--tx)!important;opacity:1!important;-webkit-appearance:none;appearance:none;box-shadow:none!important;cursor:default}
.islocked input[type=checkbox]:disabled,.islocked input[type=radio]:disabled{-webkit-appearance:auto;appearance:auto}
.islocked button[data-lk]{display:none!important}.islocked input:disabled::placeholder{color:transparent}.islocked #cp_addc{display:none}
.islocked .srcedit,.islocked .lkhide{display:none}.sstyle{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.sstyle select{width:auto;min-width:0;padding:2px 4px;min-height:0}
.rcard{border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin:0 0 10px;background:var(--card)}.rcard.off{opacity:.6}
.rcard .rsay{font-size:15px;margin:0 0 8px}.rcard .rraw{font:12px ui-monospace,monospace;color:var(--mu);margin-top:6px;word-break:break-word}
.rline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}.rline select,.rline input{width:auto;min-width:0}.rline .rlab{min-width:44px;font-weight:600;color:var(--mu);font-size:13px}
table.rref td,table.rref th{font-size:13px;vertical-align:top}
.mbt{border:1px solid var(--bd);border-radius:var(--r);margin:0 0 12px;background:var(--card)}
.mbt>summary{cursor:pointer;padding:8px 12px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
.mbt>summary::-webkit-details-marker{display:none}.mbt>summary::before{content:'⊞';color:var(--mu)}.mbt[open]>summary::before{content:'⊟'}
.mbt>summary .mu{font-weight:400}
.mbt table{margin:0}.mbt .tw{margin:0 10px 8px;border-radius:3px}
/* hyperMILL cycle pages (2026-10-14): tab strip › boxed groups › radios / ticks / values, no diagrams */
.cpw{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:14px;align-items:start}@media (max-width:1000px){.cpw{grid-template-columns:1fr}}
.cpsplit{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}@media (max-width:1300px){.cpsplit{grid-template-columns:1fr}}
.cppv{position:sticky;top:64px;border:1px solid var(--bd);border-radius:var(--r);padding:10px;background:var(--sub)}
.cptab{margin-bottom:12px}.cptab>h4{margin:6px 0}.cpbox{margin:0 0 8px}.cpf{border-bottom:1px dashed var(--bd);padding:5px 0}.cpf1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cpf1>input{flex:1;min-width:150px;min-height:30px;padding:2px 8px}.cpf1>select{width:auto;min-height:30px;padding:2px 6px}.cpf1 .cpopts{flex:2;min-width:180px}.cpbtns{display:flex;gap:2px}
.cpf2>summary{font-size:12px;color:var(--mu);cursor:pointer}.cpf3{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}.cpf3 label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);margin:0;flex:1;min-width:120px}.cpf3 input{min-height:28px;padding:2px 6px}
.cpchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.cpchip{display:inline-flex;gap:4px;align-items:center;font-size:13px}.cpchip button{border:0;background:none;color:var(--mu);cursor:pointer;padding:0 2px}
.mllist{display:flex;flex-direction:column;gap:8px}.mlrow{border:1px solid var(--bd2);border-radius:var(--r);padding:8px 12px;background:var(--card)}
.mlsay{font-size:15px;margin-bottom:6px}.mlscope{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}.mlscope select{width:auto;max-width:240px;min-height:30px;padding:2px 6px;font-size:13px}
.mlvals{display:flex;flex-wrap:wrap;gap:10px}.mlv{display:flex;flex-direction:column;font-size:12px;color:var(--mu);margin:0;gap:2px}.mlv input{width:84px;min-height:30px;padding:2px 6px}.mlv small{font-size:11px}
.mlnote{display:flex;gap:6px;margin-top:6px;align-items:center}.mlnote input{flex:1;min-height:30px;padding:2px 8px}
.ttree{display:flex;flex-direction:column;gap:8px}.tfam{border:1px solid var(--bd2);border-radius:var(--r);background:var(--card)}
.tfam>summary{cursor:pointer;padding:9px 12px;display:flex;gap:12px;align-items:baseline;list-style:none}.tfam>summary::-webkit-details-marker{display:none}
.tfam>summary::before{content:'▸';color:var(--mu)}.tfam[open]>summary::before{content:'▾'}.tname2{font-weight:600;font-size:16px}
.tfhead{display:flex;flex-wrap:wrap;gap:10px;padding:4px 12px 8px;border-bottom:1px solid var(--bd)}.tfhead label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);margin:0;gap:2px}
.tsubs{padding:6px 12px}.tsub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--bd)}.tsub:last-child{border-bottom:0}
.tdot{color:var(--mu)}.tname{min-width:200px;flex:0 1 260px}.tord{width:64px}.tmeta{font-size:12px;min-width:60px}
.tops{display:flex;flex-wrap:wrap;gap:4px}.tchip{display:inline-flex;align-items:center;gap:0;border:1px solid var(--bd2);border-radius:14px;padding:2px 9px;font-size:12px;cursor:pointer;margin:0;color:var(--mu)}

<script>
/* @inline audit.js — copy of audit.js; edit audit.js, then run "node build.js" */
/* ===== Tool library audit engine (pure functions; also run under node for testing) ===== */
const AUD = (() => {
  const nz = v => v === '' || v == null || isNaN(+v) ? NaN : +v;
  const near = (a, b, tol = 0.011) => isFinite(a) && isFinite(b) && Math.abs(a - b) <= tol;
  const fmt = v => isFinite(v) ? +(+v).toFixed(3) : v;
  const sfxOf = code => {
    const t = String(code || '').replace(/\(.*?\)/g, '').trim().split(/\s+/);
    if (/^[A-Z]+$/.test(t[0])) return t[0];
    for (let i = t.length - 1; i >= 0; i--) if (/^[A-Z]{2,5}$/.test(t[i])) return t[i];
    return t[t.length - 1];
  };
  /* ---- read the geometry written in the human description ---- */
  function parseDesc(d) {
    d = String(d || ''); const o = {};
    let m;
    if ((m = d.match(/^([\d.]+)\s*mm\b/i))) {
      o.dia = +m[1];
      const rest = d.slice(m[0].length);
      const rr = rest.match(/[×x]\s*R\s*([\d.]+)/i); if (rr) o.r = +rr[1];
      const nums = [...rest.replace(/[×x]\s*R[\d.]+/i, '').matchAll(/[×x]\s*([\d.]+)(L)?(?![\d.]*\s*°)(?=\s|$)/gi)];
      for (const n of nums) { if (n[2]) o.oal = +n[1]; else if (o.len == null) o.len = +n[1]; }
      const dm = rest.match(/(\d+)\s*°/); if (dm && /TAPER/i.test(d)) o.taper = +dm[1];
    } else if ((m = d.match(/^([\d.]+)\s*(?:D|DIA)\b/i))) {
      o.dia = +m[1];
      const w = d.match(/[×xX]\s*([\d.]+)\s*W\b/i) || (/DIA/i.test(d) && d.match(/[×xX]\s*([\d.]+)/)) || null;
      if (w) o.width = +w[1];
      const r = d.match(/[×xX]\s*R\s*([\d.]+)/i) || d.match(/[×xX]\s*([\d.]+)\s*R\b/i); if (r) o.r = +r[1];
    } else if ((m = d.match(/^([\d.]+)\s*[xX]\s*([\d.]+)\s*[xX]\s*45°/))) { o.dia = +m[1]; o.width = +m[2]; }
    else if ((m = d.match(/^(\d+)\s*MM\b/i))) o.dia = +m[1];
    if ((m = d.match(/Ø\s*([\d.]+)\s*mm/i))) o.dia = +m[1];
    if ((m = d.match(/^M([\d.]+)\s*x\s*([\d.]+)/i))) { o.thread = 'M' + m[1]; o.major = +m[1]; o.pitch = +m[2]; }
    else if ((m = d.match(/^(UNC|UNF)\s*(\d+|\d\/\d+)-(\d+)/i)) || (m = d.match(/(\d+)TPI\s+(UNC|UNF)\s+(\d+)-(\d+)/i))) {
      const a = m.length === 4 ? [m[2], m[3]] : [m[3], m[4]];
      const size = a[0].includes('/') ? eval(a[0]) * 25.4 : (0.060 + 0.013 * +a[0]) * 25.4;
      o.thread = (m[1].length > 3 ? m[2] : m[1]) + ' ' + a[0] + '-' + a[1]; o.major = size; o.pitch = 25.4 / +a[1];
    } else if ((m = d.match(/^(1\/8|1\/4)\s*BSP/i))) { const t = { '1/8': [9.728, 28], '1/4': [13.157, 19] }[m[1]]; o.thread = m[1] + ' BSP'; o.major = t[0]; o.pitch = 25.4 / t[1]; }
    return o;
  }
  /* ---- decode the manufacturer part number inside the description ---- */
  function decodePart(d) {
    d = String(d || ''); let m; const o = {};
    if ((m = d.match(/\b(\d)(HREG|HRBG|HCBG|ALE)(\d{3})(\d{3,4})(?:S(\d+))?\b/))) { o.fam = 'DCS-' + m[2]; o.z = +m[1]; o.dia = +m[3] / 10; o.len = m[4].length === 3 ? +m[4] / 10 : +m[4] / 100; o.shank = m[5] && +m[5]; }
    else if ((m = d.match(/\b(\d)(CREG|CRE)(\d{3})(\d{3})(\d{3})\b/))) { o.fam = 'DCS-CRE'; o.z = +m[1]; o.dia = +m[3] / 10; o.r = +m[4] / 10; o.len = +m[5] / 10; }
    else if ((m = d.match(/\b(\d)VS([EC])(\d{3})(\d{3})S(\d+)\b/))) { o.fam = 'VS' + m[2]; o.z = +m[1]; o.dia = +m[3] / 10; if (m[2] === 'E') o.len = +m[4] / 10; else o.r = +m[4] / 10; }

    else if ((m = d.match(/KAR133\.3\.(\d{4})\.(\d{4})\.R(\d{4})/))) { o.fam = 'KAR133'; o.dia = +m[1] / 100; o.oal = +m[2] / 10; o.r = +m[3] / 100; }
    else if ((m = d.match(/\b2CTB(\d{3})(\d{3})(\d{3})\b/))) { o.fam = 'CTB'; o.dia = +m[1] / 10; o.taper = +m[2] / 10; o.len = +m[3] / 10; }
    else if ((m = d.match(/\b503\.(\d{3})\.00\b/)) || (m = d.match(/\b705\.(\d{3})\.00\b/)) || (m = d.match(/\bPF503(\d{3})\b/))) { o.fam = 'DRL'; o.dia = +m[1] / 10; }
    else if ((m = d.match(/\bTA350(\d{3})\b/))) { o.fam = 'DRL'; o.dia = +m[1] / 100; }
    else if ((m = d.match(/\bA(\d{2})(\d{3})DAM\b/))) { o.fam = 'RM'; o.dia = +(m[1] + '.' + m[2]); }
    else if ((m = d.match(/\bRE45330\d(\d{4})\b/))) { o.fam = 'RM'; o.dia = +m[1] / 100; }
    else if ((m = d.match(/\bKNS2(\d{2})(\d{3})\b/))) { o.fam = 'KNS'; o.dia = +m[1]; o.oal = +m[2] || undefined; }
    else if ((m = d.match(/ESLNR(\d{2})\d?-(\d+)-(\d+)/))) { o.fam = 'ESLNR'; o.dia = +m[1] / 10; o.len = +m[2]; o.r = +m[3] / 10; }
    else if ((m = d.match(/ESLNR(\d{2})\d{1}-(\d+)-(\d+)/))) { o.fam = 'ESLNR'; }
    else if ((m = d.match(/\bMTS(\d{2})(\d{2,3})([CD])(\d+)\b/))) { o.fam = 'MTS'; o.shank = +m[1]; o.dia = m[2].length === 3 ? +m[2] / 10 : +m[2]; o.len = +m[4]; }
    else if ((m = d.match(/\bAES([23])(\d{3})/))) { o.fam = 'AES'; o.zhint = +m[1]; o.dia = +m[2] / 10; }
    else if ((m = d.match(/\bW(?:AR|AE)(3)\d/))) { o.fam = 'WAx'; o.zhint = 3; }
    return o;
  }
  const THREAD_NOTE = 'All DC Swiss M-series cutter diameters equal exactly 0.8 × nominal — a formula pattern, not catalogue values.';

  function audit(tools) {
    const out = [];
    const add = (t, sev, field, issue, evidence, suggest) => out.push({ code: t['Tool Code'], desc: t.Description || '', type: t.Type || '', sev, field, issue, evidence: evidence || '', suggest: suggest == null ? '' : String(suggest) });
    const partUse = {};
    tools.forEach(t => {
      const d = String(t.Description || '');
      const toks = d.match(/\b[A-Z0-9][A-Z0-9.\-]{5,}\b/g) || [];
      toks.filter(x => (x.match(/\d/g) || []).length >= 6 && /[A-Z]/.test(x) && !/^\d+(\.\d+)?MM$/.test(x)).forEach(x => (partUse[x] = partUse[x] || []).push(t));
    });
    const coatByFam = {};
    tools.forEach(t => { const p = decodePart(t.Description); if (p.fam && t.Coating) (coatByFam[p.fam] = coatByFam[p.fam] || {})[t.Coating] = (coatByFam[p.fam][t.Coating] || []).concat(t['Tool Code']); });

    tools.forEach(t => {
      const code = t['Tool Code'], sfx = sfxOf(code), d = String(t.Description || '');
      const D = nz(t['Diameter (mm)']), Z = nz(t.Flutes), R = nz(t['Corner Radius (mm)']), MD = nz(t['Max DOC (mm)']);
      const P = parseDesc(d), C = decodePart(d), type = t.Type || '';
      /* completeness */
      if (!type || !isFinite(D) || !isFinite(Z)) { add(t, 'High', 'Record', 'Incomplete record — type, diameter and/or flutes are blank', `Type: ${type || '–'} · Ø: ${isFinite(D) ? D : '–'} · Z: ${isFinite(Z) ? Z : '–'}`, P.dia ? `Ø ${P.dia} from description` : ''); return; }
      /* diameter */
      if (isFinite(P.dia) && !near(P.dia, D) && type !== 'Thread Mill') add(t, 'High', 'Diameter', 'Diameter column ≠ diameter written in description', `Column ${D} vs description ${P.dia}`, P.dia);
      if (isFinite(C.dia) && !near(C.dia, D) && type !== 'Thread Mill') add(t, 'High', 'Diameter', 'Diameter column ≠ diameter encoded in manufacturer part number', `Column ${D} vs part no. ${fmt(C.dia)} (${C.fam})`, fmt(C.dia));
      if (isFinite(C.dia) && isFinite(P.dia) && !near(C.dia, P.dia) && !near(C.dia, D)) { /* already reported */ }
      else if (isFinite(C.dia) && isFinite(P.dia) && !near(C.dia, P.dia) && near(C.dia, D)) add(t, 'Med', 'Description', 'Description diameter ≠ part-number diameter (library column matches part number)', `Description ${P.dia} vs part no. ${fmt(C.dia)}`, '');
      /* length consistency */
      if (isFinite(C.len) && isFinite(P.len) && !near(C.len, P.len, 0.06)) add(t, 'Med', 'Flute length', 'Flute length in description ≠ length encoded in part number', `Description ${P.len} vs part no. ${fmt(C.len)} (${C.fam})`, '');
      /* corner radius */
      if (isFinite(C.r) && isFinite(R) && !near(C.r, R, 0.006) && type !== 'Ball End Mill') add(t, 'Med', 'Corner radius', 'Corner radius column ≠ radius in part number', `Column ${R} vs part no. ${fmt(C.r)}`, fmt(C.r));
      if (isFinite(P.r) && isFinite(R) && !near(P.r, R, 0.006) && type !== 'T-Slot Cutter' && type !== 'Woodruff Cutter') add(t, 'Med', 'Corner radius', 'Corner radius column ≠ radius in description', `Column ${R} vs description ${P.r}`, P.r);
      if (type === 'Ball End Mill' && !P.taper && isFinite(R) && !near(R, D / 2, 0.006)) add(t, 'High', 'Corner radius', 'Ball-nose radius is not Ø/2', `R ${R} vs Ø/2 = ${D / 2}`, D / 2);
      /* flutes */
      if (isFinite(C.z) && Z !== C.z) add(t, 'High', 'Flutes', 'Flutes column ≠ flute count in part number', `Column ${Z} vs part no. ${C.z}`, C.z);
      if (C.zhint && Z !== C.zhint && C.fam === 'AES') add(t, 'Low', 'Flutes', `Part-number prefix (${C.fam}${C.zhint}…) may indicate ${C.zhint} flutes — verify`, `Column ${Z}`, '');
      if (C.fam === 'WAx' && Z !== 3) add(t, 'Low', 'Flutes', 'Part-number prefix (WAx3…) may indicate 3 flutes — verify', `Column ${Z}`, '');
      if (Z > 6 && !/SAW/i.test(d)) add(t, 'High', 'Flutes', 'Implausible flute count — looks like a length typed into the Flutes column', `Z = ${Z}${P.len ? ` (description length ${P.len})` : C.len ? ` (part no. length ${C.len})` : ''}`, type === 'Thread Mill' ? '3 (typical for this cutter) — confirm' : '2–4 — confirm');
      if (/T-Slot/i.test(type) && Z < 2) add(t, 'High', 'Flutes', 'T-slot cutter with fewer than 2 teeth', `Z = ${Z}`, '4 (all other T-slot cutters in library)');
      else if (/T-Slot/i.test(type) && Z === 3) add(t, 'Low', 'Flutes', '3-tooth T-slot cutter — all others are 4; verify', `Z = ${Z}`, '');
      if (type === 'Slitting Saw' && !(Z > 0)) add(t, 'Med', 'Flutes', 'Tooth count missing — feed (mm/min) cannot be calculated', 'Z = 0', 'Enter number of teeth from the saw');
      if (type === 'Reamer' && D <= 5 && Z >= 6) add(t, 'Low', 'Flutes', 'Reamer ≤ Ø5 listed with 6+ flutes — verify against catalogue', `Z = ${Z}`, '');
      if (/Drill|Spot/i.test(type) && Z === 1) add(t, 'Info', 'Flutes', 'Drills show 1 flute — fine if you use Fz as mm/rev, but the real tool has 2 flutes', 'Z = 1', '');

      const flute = isFinite(P.len) ? P.len : isFinite(C.len) ? C.len : NaN;
      if (/End Mill|Lollipop/i.test(type) && isFinite(flute) && isFinite(MD) && !near(MD, flute, 0.06))
        add(t, 'Med', 'Max DOC', near(MD, D) ? 'Max DOC equals the diameter (placeholder?) — description/part number gives the flute length' : 'Max DOC ≠ flute length from description', `Max DOC ${MD} vs flute length ${flute}`, flute);
      if (type === 'Thread Mill' && isFinite(C.len) && isFinite(MD) && !near(MD, C.len, 0.06)) add(t, 'Med', 'Max DOC', 'Max DOC is not the cutting/thread length from the part number', `Max DOC ${MD} vs part no. length ${C.len}`, C.len);
      else if (type === 'Thread Mill' && near(MD, D) && !C.len) add(t, 'Low', 'Max DOC', 'Max DOC equals the diameter — enter the thread/cutting length', `Max DOC ${MD}`, '');
      if (/Face Mill/i.test(type) && isFinite(MD) && near(MD, D)) add(t, 'Med', 'Max DOC', 'Max DOC equals the cutter diameter — for insert face mills this is limited by the insert (typically 2–10 mm)', `Max DOC ${MD}`, '');
      if (/Face Mill/i.test(type) && isFinite(R) && R > 3 && isFinite(MD) && near(R, MD, 0.01)) add(t, 'Med', 'Corner radius', 'Corner radius and Max DOC are identical odd values — probably copied from one cell to the other', `R ${R} = Max DOC ${MD}`, '');
      if (/Chamfer|Spot/i.test(type) && isFinite(MD) && near(MD, D)) add(t, 'Info', 'Max DOC', 'Max DOC equals Ø — for chamfer/spot tools this should be the cutting depth', `Max DOC ${MD}`, '');
      if (/Drill/i.test(type) && !t.Coating && !/HSS/i.test(type)) add(t, 'Low', 'Coating', 'Coating blank', '', '');
      /* part-number plausibility */
      if (C.fam === 'KAR133' && isFinite(P.len) && P.len > 0.45 * C.oal) add(t, 'High', 'Flute length', 'Flute length is impossible for this overall length — the cutter is only ' + C.oal + ' mm long', `Description flute ${P.len} vs OAL ${C.oal} (Karnasch 133.3 part no.)`, '');
      if (/25 FLUTE/i.test(d)) add(t, 'Med', 'Description', 'Description contains "25 FLUTE" placeholder, not a part number', d, '');

      if (/ESLNR202-/.test(d)) add(t, 'Low', 'Description', 'Part number looks mistyped (ESLNR202-… vs ESLNR2020-…)', d, '');
      if (/ or /i.test(d)) add(t, 'Low', 'Description', 'Two alternative part numbers in one description — keep the one that matches the tool', d, '');
      if (/DUP/i.test(code) || /DUPE?/i.test(d)) add(t, 'Low', 'Record', 'Marked as a duplicate', '', 'Delete if no longer needed');

      if (type === 'Thread Mill') {
        if (P.thread && isFinite(P.major) && isFinite(P.pitch)) {
          const minor = P.major - 1.0825 * P.pitch;
          if (D > P.major - P.pitch - 0.04) add(t, 'High', 'Diameter', 'Cutter diameter is as large as (or larger than) the tap-drill / core hole — it cannot enter a correctly drilled hole', `Ø ${D} vs ${P.thread} tap-drill ≈ ${fmt(P.major - P.pitch)} mm (thread minor ≈ ${fmt(minor)})`, 'Check the DC Swiss catalogue d1 for this part number');
        }
        if (/DC SWISS/i.test(d) && P.thread && /^M/.test(P.thread) && near(D, 0.8 * P.major, 0.006)) add(t, 'Info', 'Diameter', 'Diameter is exactly 0.8 × nominal thread — looks like an estimate. DC Swiss publishes a specific d1 per part number.', `Ø ${D} = 0.8 × ${P.major}`, '');
        if (C.fam === 'MTS' && isFinite(C.dia) && !near(C.dia, D)) add(t, 'High', 'Diameter', 'Diameter ≠ part number', `Column ${D} vs ${C.dia}`, C.dia);
      }
    });
    /* duplicates and cross-family coating inconsistencies */
    Object.entries(partUse).forEach(([pn, arr]) => {
      if (arr.length < 2) return;
      const dias = [...new Set(arr.map(t => nz(t['Diameter (mm)'])))];
      if (dias.length > 1) arr.forEach(t => add(t, 'High', 'Part number', 'Same part number used on tools with different diameters — one of them is wrong', `${pn} → ${arr.map(x => x['Tool Code'] + ' Ø' + x['Diameter (mm)']).join(', ')}`, ''));
      else if (!arr.some(t => /DUP/i.test(t['Tool Code'] + t.Description))) arr.forEach(t => add(t, 'Low', 'Part number', 'Same part number appears on more than one record', `${pn} → ${arr.map(x => x['Tool Code']).join(', ')}`, ''));
    });

      const ks = Object.keys(o);
      if (ks.length > 1 && /DCS-ALE|DCS-HREG|VS/.test(fam)) { const minor = ks.sort((a, b) => o[a].length - o[b].length)[0]; o[minor].forEach(c => { const t = tools.find(x => x['Tool Code'] === c); add(t, 'Low', 'Coating', `Same part-number family (${fam}) is listed with different coatings: ${ks.join(' / ')}`, `${c}: ${minor}`, ''); }); }
    });

    const horn = d => { const m = String(d).match(/\b(?:R)?([1-3]\d{2}|6[01]\d)(?:\.)?(\d{4})(?:\.)?(\d{2})(?!\d)/); if (!m) return null; let fam = m[1]; if (/^6/.test(fam)) fam = '3' + fam.slice(1); const a = +m[2], b = +m[3]; return { fam, a, b, r: a < 100 ? a / 10 : NaN, w: a < 100 ? b / 10 : NaN }; };
    const hf = {};
    const hfam = d => { const m = String(d).match(/\b(?:R)?([1-3]\d{2}|6[01]\d)\.?\d{4}/); if (!m) return null; return /^6/.test(m[1]) ? '3' + m[1].slice(1) : m[1]; };

/* ---------- 2026-10-14: hyperMILL cycle PAGES — every cycle as its dialog: tab › box › field, read from the 226 screenshots
   (hypermill_cycle_pages.docx). Tabs that only pick geometry (Contours selection lists, Boundary curves, Feature, Transformation)
   are left out; the Tool tab only where it holds cutting values. Spec lines:
     @Group | match regex | note        =Tab        [Box]        %MACRO … / &MACRO (shared blocks)
     key * Label : a | b    radio        key v Label : a | b   dropdown        key ? Label   tick box (On / Off)
     key #mm Label          value (unit after #: mm, °, s, rpm, mm/min, or none)       key $ Label   value / hyperMILL expression
     … @key=Value           shown only when that radio / dropdown is set to Value (as hyperMILL hides the other mode's fields)
     … // hint
   Existing keys are kept so logged cuts keep their labels. Editable in Cycles → Cycle pages (saved copy wins). ---------- */
const CPL=String.raw`%DMODE
=Contours
[Drilling mode]
drill_mode * Drilling mode : 2D drilling | 2D multi index drilling | 5X Drilling
%DOPT
=Optimization
[Sorting strategy]
sort * Sorting strategy : Off | Shortest distance | Circular | X parallel | Y parallel | Contour parallel
[Start]
start_ref ? Use start reference
[Z optimization]
max_z #mm Max. Z depth
%MAREA
[Machining area]
top_off #mm Top offset
abs_top ? Absolute top
off_bot #mm Offset bottom
abs_bot ? Absolute bottom
tip_comp ? Tip angle compensation
break_through ? Break through length
%HOLESEC
[Hole security]
clear_d #mm Clearance distance
retract_d #mm Retract distance
%RETSAFE
[Retract mode]
ret_mode * Retract mode : Clearance plane | Clearance distance
[Safety]
safe_plane #mm Clearance plane
safe_dist #mm Clearance distance
%MACRO3D
=Macros
[Macro mode]
macro_mode * Macro mode : Auto | Manual
[Auto macro]
macro_len $ Macro length @macro_mode=Auto // e.g. 0.35*T:Dia
side_dist $ Side distance @macro_mode=Auto // e.g. 0.1*T:Dia
vert_dist $ Vertical distance @macro_mode=Auto // e.g. 0.02*T:Dia
[Approach macro]
app_macro v Approach macro : Perpendicular | Tangential | Quarter circle | Half circle | None @macro_mode=Manual
app_r #mm Radius @macro_mode=Manual
app_h #mm Height @macro_mode=Manual
app_ext #mm Macro extension @macro_mode=Manual
[Retract macro]
ret_macro v Retract macro : Perpendicular | Tangential | Quarter circle | Half circle | None @macro_mode=Manual
ret_r #mm Radius @macro_mode=Manual
ret_h #mm Height @macro_mode=Manual
ret_ext #mm Macro extension @macro_mode=Manual
[Contour extension (open contours only)]
ext_start #mm Start @macro_mode=Manual
ext_end #mm End @macro_mode=Manual
[Macro position]
macro_pos * Macro position : Left | Right @macro_mode=Manual
[Feedrate macros]
f_app $ Feedrate approach // e.g. J:F
f_ret $ Feedrate retract // e.g. J:F
%RETSAFE3D
[Retract mode]
retract_sel v Retract mode : Clearance plane | Clearance distance
[Safety]
safe_plane #mm Clearance plane
axial_clear #mm Axial clearance
side_clear $ Side clearance // e.g. 0.1*T:Rad
%HPC
=High Performance
[High Performance Roughing]
hp_mode ? High Performance Mode
open_cut ? Opening cut
hp_zigzag ? Zigzag
[Feedrate limit]
min_feed $ Min. feedrate // tick + value in hyperMILL (e.g. J:F*0.5) — leave blank when unticked
[Reposition]
repos_clear $ Clearance // e.g. J:Sd*0.1
repos_f #mm/min Feedrate
[Infeed]
dense_step # Dense area stepover (factor)
plunge_f $ Plunge feedrate // e.g. J:Fr
infeed_min_feed ? Min. feedrate
[Entry feedrate]
side_entry # Factor side entry
%MAN
[Machining area]
man_top ? Manual top
man_bot ? Manual bottom
%BND3D

   instead of localStorage (5 MB). A synchronous in-memory Map mirrors everything so the existing .data() calls keep

/* ---------- 2. AI (replaces Claude with Ollama) ---------- */
const OLLAMA_URL   = 'http://localhost:11434';
const OLLAMA_MODEL = 'llama3.1:8b';   // change to any model you have: qwen2.5:14b, mistral-nemo, ...

const AI = {
  async ask(messages, opts = {}){
    const { tools, onText, signal } = opts || {};
    const msgs = messages.map(m => ({
      role: m.role,
      content: typeof m.content === 'string'
        ? m.content
        : Array.isArray(m.content) ? m.content.map(b => b.text || '').join('\n') : String(m.content ?? '')
    }));

    const body = {
      model: OLLAMA_MODEL,
      messages: msgs,
      stream: true,
      ...(tools && tools.length ? { tools: tools.map(t => ({
        type: 'function',
        function: { name: t.name, description: t.description, parameters: t.inputSchema }
      })) } : {})
    };

    const res = await fetch(OLLAMA_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal
    });
    if (!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error('Ollama error ' + res.status + (t ? ': ' + t.slice(0,150) : '') +
        ' — is Ollama running? Try:  ollama serve  in a terminal.');
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '';
    const toolCalls = [];

    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        let j; try { j = JSON.parse(line); } catch(e){ continue; }
        const delta = j.message && j.message.content;
        if (delta){ text += delta; if (onText) onText({ text }); }
        if (j.message && j.message.tool_calls) toolCalls.push.apply(toolCalls, j.message.tool_calls);
      }
    }

    /* Run the tools the AI asked for, then ask again with the answers */
    if (toolCalls.length){
      const byName = {};
      (tools||[]).forEach(t => byName[t.name] = t);
      const follow = msgs.concat([{ role: 'assistant', content: '', tool_calls: toolCalls }]);
      for (const tc of toolCalls){
        const t = byName[tc.function && tc.function.name];
        let out;
        try {
          const args = typeof (tc.function && tc.function.arguments) === 'string'
            ? JSON.parse(tc.function.arguments || '{}')
            : ((tc.function && tc.function.arguments) || {});
          out = t ? await t.execute(args) : { error: 'unknown tool' };
        } catch(e){ out = { error: String(e.message || e) }; }
        follow.push({ role: 'tool', content: JSON.stringify(out), name: tc.function && tc.function.name });
      }
      const res2 = await fetch(OLLAMA_URL + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: OLLAMA_MODEL, messages: follow, stream: false }),
        signal
      });
      if (!res2.ok) throw new Error('Ollama error ' + res2.status);
      const j2 = await res2.json();
      text = (j2.message && j2.message.content) || text;
      if (onText) onText({ text });
    }

    return { text };
  }
};

/* ---------- Phase 5: Gemini (replaces Ollama for Ask AI and Learn AI) ----------
   Key from localStorage 'gemini.key' (Settings). Streams over SSE; the app's TOOLS become Gemini
   functionDeclarations (inputSchema → parameters). Tool calls are run here and their results sent back until the
   model answers in text. onText receives the whole answer so far, as the old client did. */
const GEMINI_MODEL = 'gemini-3.8-flash';
const GEMINI_URL = m => 'https://generativelanguage.googleapis.com/v1beta/models/' + m + ':streamGenerateContent?alt=sse';
const GEM_SCHEMA_KEYS = ['type', 'description', 'enum', 'properties', 'required', 'items', 'format', 'nullable', 'minimum', 'maximum', 'minItems', 'maxItems'];
function geminiSchema(s){
  if (!s || typeof s !== 'object') return s;
  const o = {};
  GEM_SCHEMA_KEYS.forEach(k => { if (s[k] !== undefined) o[k] = s[k]; });
  if (o.properties) { const p = {}; Object.entries(o.properties).forEach(([k, v]) => p[k] = geminiSchema(v)); o.properties = p; }
  if (o.items) o.items = geminiSchema(o.items);
  if (Array.isArray(o.required) && o.properties) o.required = o.required.filter(k => k in o.properties);
  return o;
}
function geminiTools(tools){
  if (!tools || !tools.length) return null;
  return [{ functionDeclarations: tools.map(t => {
    const d = { name: t.name, description: t.description || '' }, p = geminiSchema(t.inputSchema);   /* app: inputSchema · Gemini: parameters */
    if (p && p.properties && Object.keys(p.properties).length) d.parameters = p;
    return d;
  }) }];
}
const gText = c => typeof c === 'string' ? c : Array.isArray(c) ? c.map(b => (b && b.text) || '').join('\n') : String(c ?? '');
async function geminiAsk(messages, opts = {}){
  const { tools, onText, signal } = opts || {};
  let key = ''; try { key = localStorage.getItem('gemini.key') || ''; } catch(e){}
  if (!key) throw new Error('No Gemini API key yet — paste it in Settings → Gemini API key.');
  const contents = [];
  messages.forEach(m => { const t = gText(m.content); if (!t.trim()) return; const role = m.role === 'assistant' ? 'model' : 'user';
    const last = contents[contents.length - 1]; if (last && last.role === role) last.parts.push({ text: t }); else contents.push({ role, parts: [{ text: t }] }); });
  const gt = geminiTools(tools), byName = {}; (tools || []).forEach(t => byName[t.name] = t);
  let text = '';
  for (let round = 0; round < 6; round++){
    const res = await fetch(GEMINI_URL(GEMINI_MODEL), { method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(Object.assign({ contents }, gt ? { tools: gt } : {})) });
    if (!res.ok){
      let msg = ''; try { const j = await res.json(); msg = (j.error && j.error.message) || ''; } catch(e){}
      throw new Error('Gemini error ' + res.status + (msg ? ': ' + msg.slice(0, 200) : '') + (res.status === 400 || res.status === 403 ? ' — check the API key in Settings.' : res.status === 404 ? ' — the model name (' + GEMINI_MODEL + ') may no longer be available.' : ''));
    }
    const reader = res.body.getReader(), dec = new TextDecoder(), parts = [], calls = [];
    let buf = '';
    const take = line => {
      line = line.trim(); if (!line.startsWith('data:')) return;
      const d = line.slice(5).trim(); if (!d || d === '[DONE]') return;
      let j; try { j = JSON.parse(d); } catch(e){ return; }
      const ps = (((j.candidates || [])[0] || {}).content || {}).parts || [];
      ps.forEach(p => {
        if (p.functionCall){ calls.push(p.functionCall); parts.push(p); }
        else if (typeof p.text === 'string' && !p.thought){ text += p.text; parts.push(p); if (onText) onText({ text }); }
        else parts.push(p);
      });
    };
    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl; while ((nl = buf.indexOf('\n')) >= 0){ take(buf.slice(0, nl)); buf = buf.slice(nl + 1); }
    }
    if (buf) take(buf);
    if (!calls.length) break;
    /* run the tools Gemini asked for, then ask again with their results */
    contents.push({ role: 'model', parts });
    const answers = [];
    for (const fc of calls){
      const t = byName[fc.name]; let out;
      try { out = t ? await t.execute(fc.args || {}) : { error: 'unknown tool ' + fc.name }; } catch(e){ out = { error: String(e.message || e) }; }
      if (out === undefined) out = null;
      answers.push({ functionResponse: { name: fc.name, response: (out && typeof out === 'object' && !Array.isArray(out)) ? out : { result: out } } });
    }
    contents.push({ role: 'user', parts: answers });
    if (text) text += '\n\n';
  }
  return { text };
}

/* ---------- AI via OpenRouter: a free open-source model (decision 2026-10-14, after the Gemini free quota ran out) ----------

   The app's TOOLS become OpenAI-style functions (inputSchema → parameters); tool calls run here and are answered until the
   model replies in text. Free models are limited to 50 requests a day (1,000 once 10 credits have ever been bought). */
const AI_URL = 'https://openrouter.ai/api/v1/chat/completions';

async function openAsk(messages, opts = {}){
  const { tools, onText, signal } = opts || {};

  const fns = (tools || []).map(t => { const p = geminiSchema(t.inputSchema) || {}; return { type: 'function', function: { name: t.name, description: t.description || '', parameters: p.properties && Object.keys(p.properties).length ? p : { type: 'object', properties: {} } } }; });
  const byName = {}; (tools || []).forEach(t => byName[t.name] = t);
  let text = '';
  for (let round = 0; round < 6; round++){
    const res = await fetch(AI_URL, { method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key, 'HTTP-Referer': location.origin, 'X-Title': 'CNC Shop Assistant' },
      body: JSON.stringify(Object.assign({ model: AI_MODEL, messages: msgs, stream: true }, fns.length ? { tools: fns } : {})) });
    if (!res.ok){
      let msg = ''; try { const j = await res.json(); msg = (j.error && (j.error.message || j.error.code)) || ''; } catch(e){}
      throw new Error('AI error ' + res.status + (msg ? ': ' + String(msg).slice(0, 200) : '') + (res.status === 401 ? ' — check the OpenRouter key in Settings.' : res.status === 429 ? ' — the free daily limit (50 requests) is used up; it resets tomorrow.' : res.status === 404 ? ' — the model (' + AI_MODEL + ') may no longer be free.' : ''));
    }
    const reader = res.body.getReader(), dec = new TextDecoder(), calls = [];
    let buf = '', said = '';
    const take = line => {
      line = line.trim(); if (!line.startsWith('data:')) return;
      const d = line.slice(5).trim(); if (!d || d === '[DONE]') return;
      let j; try { j = JSON.parse(d); } catch(e){ return; }
      if (j.error) throw new Error('AI error: ' + (j.error.message || j.error.code || 'stream failed'));
      const delta = ((j.choices || [])[0] || {}).delta || {};
      if (typeof delta.content === 'string' && delta.content){ said += delta.content; text += delta.content; if (onText) onText({ text }); }
      (delta.tool_calls || []).forEach(tc => { const i = tc.index != null ? tc.index : calls.length; const c = calls[i] = calls[i] || { id: '', name: '', args: '' };
        if (tc.id) c.id = tc.id; if (tc.function){ if (tc.function.name) c.name += tc.function.name; if (tc.function.arguments) c.args += tc.function.arguments; } });
    };
    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl; while ((nl = buf.indexOf('\n')) >= 0){ take(buf.slice(0, nl)); buf = buf.slice(nl + 1); }
    }
    if (buf) take(buf);
    const cs = calls.filter(c => c && c.name);
    if (!cs.length) break;
    cs.forEach((c, i) => { if (!c.id) c.id = 'call_' + round + '_' + i; });
    msgs.push({ role: 'assistant', content: said || null, tool_calls: cs.map(c => ({ id: c.id, type: 'function', function: { name: c.name, arguments: c.args || '{}' } })) });
    for (const c of cs){
      const t = byName[c.name]; let out;
      try { const args = c.args ? JSON.parse(c.args) : {}; out = t ? await t.execute(args) : { error: 'unknown tool ' + c.name }; } catch(e){ out = { error: String(e.message || e) }; }
      let s = ''; try { s = JSON.stringify(out === undefined ? null : out); } catch(e){ s = String(out); }
      msgs.push({ role: 'tool', tool_call_id: c.id, content: s.length > 30000 ? s.slice(0, 30000) + '…(cut)' : s });
    }
    if (text) text += '\n\n';
  }
  return { text };
}

/* ---------- Phase 1: Google Sheet as master data store ----------
   loadSheets(id, tabs) fetches each tab as CSV via Google's gviz endpoint and returns {tabName: rows[]}.
   Numeric cells become numbers; these columns are JSON-parsed when non-empty:
   usableAs, opDefaults, ap, ae, hyperMILL, inputs, out, options. The cycleparams tab is rebuilt from
   one-row-per-parameter back into one group per 'group' column value. */
function parseCSV(text){
  const rows=[];let row=[],field='',inQ=false,i=0;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue}inQ=false;i++;continue}
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue}
    if(c===','){row.push(field);field='';i++;continue}
    if(c==='\r'){i++;continue}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue}
    field+=c;i++;
  }
  if(field!==''||row.length){row.push(field);rows.push(row)}
  return rows;
}

      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)continue;
      csv=await r.text();
    }catch(e){continue}
    if(!csv||csv.trim().startsWith('<'))continue;
    const rows=parseCSV(csv);
    if(rows.length<1){out[tab]=[];continue}
    const head=rows[0],body=rows.slice(1);SHEET_HEAD[tab]=head.slice();
    const objs=body.map(r=>{const o={};head.forEach((h,i)=>{let v=r[i];if(v==null)v='';v=String(v).trim();

/* SYS_CORE goes with every turn; KNOWLEDGE is added only when the question needs reasoning (see needKnowledge) */
const SYS_CORE=`You are a CNC machining assistant for one machinist (metric, hyperMILL CAM, Mazak Variaxis i-500 / Hurco VMX42UDi / Quaser machines). Each question arrives with an APP CONTEXT block the app has already resolved: the tools matched (e.g. "10mm BX" = every BX tool of Ø10 — treat them as one choice and name the codes), the material record, any setup facts, the CHEAT SHEET rows (manufacturer / your_logs / calibrated / typical) and the LOGGED CUTS for those tools. Use it first; call tools only for anything missing.
Sub-cycles: hyperMILL cycles are a tree — family › operation › sub-cycle (e.g. Roughing (3D) › Rough › Trochoidal). If the user's question names a sub-cycle, prefer tagged cuts over baseline. If it names a family only, present the sub-cycles and say which one your number comes from. Never use a cut tagged with one sub-cycle as evidence for a sibling sub-cycle. Source tiers in the context: DB-SUB (verified tagged cuts, this exact tool + sub-cycle) › DB-SUB-FAM (same tool suffix) › DB › MFR › MFR≈ › CAL › BASE.
Source order — always say which one each number comes from:
 1. YOUR VERIFIED LOGS — cuts with verified:true and result Good/Stable/Quick/Good Finish. Logged cuts WITHOUT verified:true are reference only: you may show them for comparison, but never recommend their numbers as the value, and say they are unverified. Bad/Heavy are warnings.
 2. MANUFACTURER catalogue data (cheat sheet "manufacturer"; "estimated": true means scaled from another material or a similar tool — say "manufacturer-based estimate").
 3. CALIBRATED (model fitted to the user's logs) and TYPICAL (published/typical starting values).
 4. Your own general machining knowledge — allowed when 1–3 are missing or to sanity-check, but label it "general knowledge, not from a catalogue". You cannot browse the web; never claim you looked something up online.
When there are no logged cuts for the case, still give a concrete recommendation: pick the most trustworthy available source, then adjust for the setup.
SETUP ADJUSTMENTS: a workpiece projecting far from the vice (e.g. 200 mm) is the weakest link — it chatters before the tool does. Then: prefer dynamic/trochoidal roughing (hyperMILL MAXX/optimised) with low radial engagement (ae ≈ 5–8 % of Ø), keep ap moderate and step down in levels starting at the top, climb mill, reduce feed per tooth ~20–30 % from the clamped-solid value, keep RPM so Vc sits at the low end of the range, avoid full-width slotting, rough the top of the part first while it is stiffest, and suggest supporting it (jack/support, tailstock, deeper clamping, stub fixture, or machining in two setups). Long TOOL stick-out (L/D > 4) likewise: reduce ae and fz, or use a necked tool. Never exceed the machine spindle limit (cheat-sheet RPM already respects it). Feed = RPM × Fz × flutes; RPM = Vc × 1000 / (π × D).
ANSWER FORMAT (markdown): start with a one-line verdict. Then "### Start here" as a table: Parameter | Value | Source (Vc, RPM, Fz, Feed, ap, ae, strategy/cycle, coolant). Then "### Compared" — a short table of the sources available (manufacturer / your logs / calibrated / typical) with RPM, Fz and feed. Then "### Because of your setup" with 2–5 bullets. Add "### Check" with the calc results (MRR, chip thickness, power vs spindle) when you computed them. Finish with what to log after the cut. Keep it tight.`;
const KNOWLEDGE=`MACHINING KNOWLEDGE (use it to reason, check the numbers and explain why):
• Basics: n = Vc·1000/(π·D). Feed vf = n·fz·z (drills/reamers/bores use f mm/rev, vf = n·f). MRR = ap·ae·vf/1000 cm³/min. Use the machining_calc tool for any arithmetic — never do chip-thinning, power or RPM maths in your head.
• Radial chip thinning: when ae < D/2 the real chip is thinner than fz, so fz must rise: fz_programmed = hex/(2√(ae/D·(1−ae/D))). The cheat sheet's Fz already includes this; "max_chip_thickness_mm" is the real chip (typ. 0.03–0.10 mm roughing, 0.01–0.05 finishing for 6–12 mm carbide). Axial thinning applies to bull-nose/ball when ap < corner radius; a ball nose cuts at an effective diameter Deff = 2√(ap(D−ap)) — set speed from Deff, not D.
• Engagement rules: slotting (ae = D) = worst case — chips can't escape, heat, deflection; cut Vc ≈15–25 % and fz ≈30–40 % vs side milling and keep ap ≤ 0.5–1×D. Never quote 100 % stepover in steel/stainless/titanium for anything except slotting. Dynamic/HPC: ae 5–15 % with ap up to 1.5–3×D (within cutting length) and stay inside the flute length. Conventional side roughing: ae 30–50 % of D, ap 0.5–1×D. Finishing: ae 0.05–0.3 mm walls; scallop on 3D finishing h = ae²/(8R) → ae = √(8·R·h).
• Deflection: tool deflection grows with (L/D)³. Cut ap/ae and fz by ~20–30 % at L/D 4, ~40–50 % at L/D 6+, and use shorter reach/ necked tools. Chatter: change RPM ±10–15 % (stability lobes), lower ae, raise fz (chip load damps), shorten stick-out, shrink-fit/hydraulic holders, avoid long overhang workpieces.
• Heat/material: aluminium — high Vc (up to spindle limit), large fz, 2–3 flute polished, flood/air blast, avoid built-up edge (no TiN-type coatings); stainless — keep cutting (never dwell: it work-hardens), sharp tools, ae ≥ 5 % so you cut under the hardened layer, steady chip load, flood coolant; titanium — Vc low (40–90 m/min carbide), high flood pressure, low ae dynamic, heat stays in the tool; tool steel/hardened — low ae, light ap, higher Vc is OK with AlTiN, dry/air for >50 HRC; plastics (PEEK/Delrin) — sharp polished single/two flute, high Vc, no heat build-up (melt), air/mist, CF30 is abrasive → coated/diamond tools; cast iron — dry.
• Tool life: Vc has the strongest effect (Taylor: life ∝ Vc^-3 to -5 for carbide). 10 % more Vc ≈ 30–40 % less life. fz and ap matter far less. If a tool dies early cut Vc first; if it chatters/ breaks raise or lower fz and engagement first.
• Power / torque: P(kW) ≈ ae·ap·vf·kc/(60·10⁶·η), kc = kc1.1·hex^-0.25, η≈0.8. The calc tool does this. Check against the machine's spindle power and the torque curve — at low RPM large cutters are torque-limited.
• Drilling: carbide drills 2–5×D without peck if internal coolant; peck (≈ 0.5–1×D) for >5×D or without through-coolant; spot-drill first; reduce f ~30 % when exiting cross-holes; chip evacuation first. Reaming: leave 0.1–0.3 mm, Vc ≈ 50–70 % of drilling Vc, f 2–3× the drill's. Boring: light depth, small nose radius, high Vc.
• Thread milling: climb mill, radial infeed in 2–3 passes for hard materials, reduce feed on the arc: vf_tool-centre = vf_thread·(D_major−D_tool)/D_major for internal threads. Pre-hole to minor diameter.
• hyperMILL: MAXX roughing = constant-engagement trochoidal (set ae as % of D and stepdown ≤ flute length); 3D optimised roughing for general; use rest-material/ residual roughing before small finishing tools; 5-axis tilting lets a shorter tool reach (stiffer). Always check collision/holder clearance with the shortest tool.
• Accuracy & surface finish: leave 0.2–0.5 mm stock for semi-finish, equal finishing stock, constant engagement on finishing, climb milling, ap at least 2× the radius error of the previous tool; for tolerance work let the part and tool settle thermally.
• Sanity checks to apply to every answer: RPM ≤ spindle limit; ap ≤ cutting length; ae ≤ D (and ≤ 0.5D unless slotting); chip thickness in the plausible band; feed matches RPM × fz × z; Vc plausible for the ISO group (steel 80–250, stainless 60–180, Ti 40–120, Al 300–1500, PEEK 200–500 m/min carbide). If the cheat sheet disagrees with these checks, say so rather than repeating the number.
• Reading the cheat-sheet fields: "calibrated" with a calibration note naming "overall cutting style" or "estimated from other materials" is weaker evidence than a calibration on that tool type — say so. "estimated": true / "derived_from_iso_group" = the manufacturer's printed data was for another material group of the same class and was scaled.
• If the request lacks something that changes the answer a lot (material, tool, operation, stick-out, machine rigidity), give a best answer and ask ONE short follow-up; never refuse to answer.`;
const SYS=SYS_CORE+"\n"+KNOWLEDGE;/* full prompt, kept for reference */
function promptDefaults(){return{'ask.core':SYS_CORE,'ask.knowledge':KNOWLEDGE,'learn.tutor':TSYS}}
function promptFor(key){const p=(L.prompts||[]).find(x=>x&&x.key===key);return (p&&p.text)||promptDefaults()[key]||''}
/* Knowledge is needed for 'why' questions, cycle questions, or material questions that are not a plain number lookup.
   Once a conversation has used it, it stays on so follow-up turns send the same (cacheable) prefix. */
const WHY=/\b(why|explain|compared?|comparison|better|safe|safer|should i|reason|how come|vs\.?|versus)\b/i;
const LOOKUP=/^\s*(what|which|give me|tell me|list)\b[^?]*\b(rpm|feeds?|speeds?|vc|fz|sfm|s\s*&\s*f|parameters?|settings)\b/i;
function needKnowledge(q,R){if(WHY.test(q))return true;if(R.cycles&&R.cycles.length)return true;return !!R.materials.length&&!LOOKUP.test(q)}

  for(const c of ['subcycle','material','band','op','tool','r_D_band']){const groups=new Map(),out=[];
   cur.forEach(r=>{const sig=JSON.stringify(all.filter(k=>k!==c).map(k=>N9KEYS.includes(k)?n9atoms(r[k]).map(x=>x.toLowerCase()).sort().join(','):(n9blank(r[k])?'':r[k])));

function mbCSV(){const cell=v=>{if(v==null)return '';const t=String(v);return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
 const rows=L.matbands.slice().sort((a,b)=>String(a.source||'').localeCompare(String(b.source||''))||String(a.material).localeCompare(String(b.material))||String(a.cutter).localeCompare(String(b.cutter))||(+a.lo - +b.lo));
 return [MB_COLS.join(',')].concat(rows.map(r=>MB_COLS.map(k=>cell(r[k])).join(','))).join('\r\n')}
/* ---------- Baselines (2026-10-14): one row per sub-cycle × operation, laid out like hyperMILL's Formulas dialog.
   Vc ×, f/edge × scale the band values; ap / ae (×Ø) set the engagement and ap max / ae max limit it. Stored on the
   sub-cycle itself in lib/cycles (opDefaults[op]; fixed-op families on the sub-cycle's own fields). ---------- */
let BLF='';
const BL_F=[['vcMult','Vc ×'],['fzMult','f/edge ×'],['apD','ap ×Ø'],['apDmax','ap max ×Ø'],['aeD','ae ×Ø'],['aeDmax','ae max ×Ø']];
function blVals(r,op,fixed){if(fixed)return{vcMult:r.vcMult,fzMult:r.fzMult,apD:r.ap&&r.ap.mult,apDmax:r.apDmax,aeD:r.ae&&r.ae.mult,aeDmax:r.aeDmax,coolant:r.coolant,note:r.note};return (r.opDefaults&&r.opDefaults[op])||{}}
function blFormula(v,op){const x=k=>v[k]!=null&&v[k]!==''?+v[k]:null,vm=x('vcMult'),fm=x('fzMult'),ap=x('apD'),ae=x('aeD'),apm=x('apDmax'),aem=x('aeDmax');
 const opn=op==='finish'?' × finish ratio':op==='semi'?' × semi ratio':'',fop=op==='finish'?' × 0.75':op==='semi'?' × 0.85':'';
 return `Vc = Vc<sub>band</sub>${opn}${vm!=null&&vm!==1?' × '+vm:''} · fz = f/edge<sub>band</sub>${fop}${fm!=null&&fm!==1?' × '+fm:''}${ae!=null&&ae<.5?' ÷ thinning(ae)':''} · F = n·fz·z`+
  (ap!=null||ae!=null?`<br>ap ${ap!=null?ap+'×Ø':'default'}${apm!=null?' (≤ '+apm+'×Ø)':''} · ae ${ae!=null?ae+'×Ø':'default'}${aem!=null?' (≤ '+aem+'×Ø)':''}`:'')}
let BLS='';/* Baselines being edited: '' = shared, else a custom source's overrides */
const blSrcSel=()=>`<select id="bls" style="max-width:260px" title="Shared baselines, or the overrides of one custom source"><option value="">Shared baselines (all sources)</option>${(L.sources||[]).map(x=>`<option value="${esc(x.key)}"${x.key===BLS?' selected':''}>${esc(x.name)} — overrides</option>`).join('')}</select>`;
function drawBLEd(){if(BLS&&!(L.sources||[]).some(x=>x.key===BLS))BLS='';if(BLS)return drawBLSrc();const fams=famRows(),names=fams.map(([f])=>f.Cycle);if(BLF&&!names.includes(BLF))BLF='';

 const txt=(i,op,k,v,w,ph)=>`<input data-bl="${i}" data-blop="${op}" data-blk="${k}" value="${esc(v||'')}"${ph?` placeholder="${esc(ph)}"`:''} style="min-width:${w}px">`;
 const body=fams.filter(([f])=>!BLF||f.Cycle===BLF).map(([fam,fi])=>{const fixed=fam.fixedOp,subs=TR().filter(([r])=>r.parent===fam.Cycle).sort((a,b)=>(a[0].order||0)-(b[0].order||0));

 $('#pbody').innerHTML=`<div class="card"><h2>Baselines</h2><p class="mu">The formula every sub-cycle puts the <b>band</b> values through, so speed and feed ratios stay the same across materials and tools. <b>Vc ×</b> and <b>f/edge ×</b> scale the band's Vc and f/edge; <b>ap / ae ×Ø</b> set the default engagement and <b>ap max / ae max</b> are hard limits (Speeds &amp; Feeds never goes past them; the calculator turns red when you type past them). When ae is below ½Ø the programmed fz is raised by radial chip thinning. Empty = no change / no extra limit; a grey value is inherited from the family default.</p>
 <div class="row noprint">${blSrcSel()}<select id="blf" style="max-width:280px"><option value="">All families</option>${opt(names,BLF)}</select><button class="b s sm" id="blcsv">Download cycles CSV for the Sheet</button><span class="mu" id="blmsg">${fromSheet?'Your cycles tab loads from the Google Sheet — after editing here, import this CSV into the Sheet’s <i>cycles</i> tab or the Sheet will put the old values back at the next start-up.':''}</span></div>
 <details class="card" style="margin:10px 0 0;padding:10px 14px" open><summary style="cursor:pointer;font-weight:600">Square vs bull-nose end mills</summary>
 <p class="mu" style="margin:6px 0">AL, BX, BT and DM cutters with a corner radius are <b>bull nose</b> (band tables BX-R …); without one they are <b>square</b>. These factors go on top of every sub-cycle for that corner type: bull noses have a stronger corner, so they can rough harder; square end mills give the sharper wall / floor finish. Ball-nose, lollipop and chamfer tools are not affected.</p>
 <div class="tw"><table><thead><tr><th>Corner</th>${['Roughing','Semi-finishing','Finishing'].map(x=>`<th class="n">${x}: Vc ×</th><th class="n">f/edge ×</th>`).join('')}</tr></thead><tbody>${[['sq','Square'],['bull','Bull nose']].map(([g,l])=>`<tr><td><b>${l}</b></td>${['R','S','F'].map(o=>['vc','fz'].map(k=>{const cur=SET.geo&&SET.geo[g]&&SET.geo[g][o]&&SET.geo[g][o][k],d=SF.GEO_DEF[g][o][k];return `<td class="n"><input data-geo="${g}.${o}.${k}" type="number" step="any" min="0" value="${cur!=null?esc(cur):''}" placeholder="${d}" style="width:70px"></td>`}).join('')).join('')}</tr>`).join('')}</tbody></table></div>
 <p class="row" style="margin:6px 0 0"><button class="b s sm" id="geodef">Reset to defaults</button><span class="mu" id="geomsg"></span></p></details>
 <details class="card" style="margin:10px 0 0;padding:10px 14px"${SET.engage?' open':''}><summary style="cursor:pointer;font-weight:600">Calculator: how Vc and fz follow ae / ap — per cycle family</summary>
 <p class="mu" style="margin:6px 0">When you change ae or ap in the calculator, fz is re-derived by chip thinning (radial below ½Ø; axial for ball and bull-nose tools) and these factors apply, relative to the recommended engagement. The family of the sub-cycle you picked decides which row is used. A grey value is inherited (built-in family value, else the <b>All families</b> row, else the app default); type to override, clear to inherit. A Vc or fz you typed yourself is never changed. Drilling, reaming, boring, threading and probing have no ae, so they are not listed.</p>

function srcPackage(key){const S=key?(L.sources||[]).find(x=>x.key===key):{name:'Bands',note:'copy of your main band tables'};if(!S)return null;

function srcFreeze(kind){const out=[];L.materials.forEach(m=>{const mat=m.Material;if(!mat)return;mbCutters().forEach(ck=>{if(mbIsRev(ck)){if(kind==='MFR')out.push(...mbSeedRev(mat,ck));return}

 $('#form').innerHTML=`<div class="row noprint" style="margin-bottom:8px"><button class="b s sm" id="fx_coll">Collapse all</button><button class="b s sm" id="fx_exp">Expand all</button><button class="b s sm" id="fx_rdo"${custom?'':' disabled'}>Restore default order</button><span class="mu">Drag ⠿ to reorder formulas within a group, or a group heading to move the group. Every result box can be typed in to work backwards.</span></div>${cfHtml()}<div class="cs"><nav class="sb">${G.map(g=>{const fs=all.map((F,i)=>[F,i]).filter(([F])=>(F.group||G[0])===g);return fs.length?`<a class="h">${esc(g)}</a>`+fs.map(([F,i])=>`<a data-j="fc${i}">${esc(F.name)}</a>`).join(''):''}).join('')}</nav><div>`+
  G.map((g,n)=>{const fs=all.map((F,i)=>[F,i]).filter(([F])=>(F.group||G[0])===g);return fs.length?`<div class="fxgw" data-fxgw="${esc(g)}"><span class="fxh" draggable="true" data-fxgdrag="${esc(g)}" title="Drag to move this group" aria-label="Drag to move group ${esc(g)}">⠿</span><details${FXOPEN.has(g)?' open':''} id="g${n}" data-fxg="${esc(g)}" style="margin-bottom:12px;flex:1;min-width:0"><summary class="gs">${esc(g)}</summary>`+fs.map(([F,i])=>fxCard(F,i)).join('')+'</details></div>':''}).join('')+'</div></div>';
 /* 2026-10-15: every result box can be typed in. A typed result is held and the formula is solved backwards for one input
    (shown amber); "Solve for" picks which. Typing that input yourself, or ✕, gives the result back to the formula. */
 const upd=i=>{const F=all[i],h=$('#r'+i);if(!h)return;const v={},held=new Set();$$(`#form input[data-i="${i}"]`).forEach(e=>{v[e.dataset.k]=e.value===''?'':+e.value;e.classList.remove('fxsolved')});
  const T=FXT[i];let note='';
  if(T){const u=FX.pickUnknown(F,T.k,held,T.u),x=FX.solveFor(F,v,T.k,T.v,u);T.res=u;
   if(isFinite(x)){v[u]=x;const e=$(`#form input[data-i="${i}"][data-k="${u}"]`);if(e){e.value=+x.toPrecision(5);e.classList.add('fxsolved')}}
   else note=u?`No ${esc((F.inputs.find(z=>z.k===u)||{}).label||u)} gives that result — try another “Solve for”.`:'That result does not depend on any input you can change.'}
  const r=FX.run(F,v),num=r.rows.filter(x=>!x.hide);
  if(h.dataset.k!==F.key+'|'+num.map(x=>x.k).join()){h.dataset.k=F.key+'|'+num.map(x=>x.k).join();
   h.innerHTML=num.map(x=>x.text!=null?`<div>${esc(x.label)}<b style="font-size:16px" data-ot="${esc(x.k)}"></b></div>`:`<div>${esc(x.label)}<input class="fxout" data-o="${i}" data-k="${esc(x.k)}" type="number" step="any" inputmode="decimal" title="Type a result to work backwards"><button class="b s sm fxclr" data-fxclr="${i}" data-k="${esc(x.k)}" title="Give this result back to the formula" hidden>✕</button></div>`).join('')+`<div class="fxsolve mu" style="font-size:13px;flex-basis:100%"></div><div class="fxerr bad" style="font-size:13px;flex-basis:100%"></div>`}
  num.forEach(x=>{if(x.text!=null){const b=h.querySelector(`[data-ot="${CSS.escape(x.k)}"]`);if(b)b.textContent=fxVal(x);return}const e=h.querySelector(`input[data-k="${CSS.escape(x.k)}"]`);if(!e)return;const mine=T&&T.k===x.k;
   e.classList.toggle('fxheld',!!mine);const c=h.querySelector(`[data-fxclr][data-k="${CSS.escape(x.k)}"]`);if(c)c.hidden=!mine;if(document.activeElement!==e)e.value=mine?T.v:(isFinite(x.value)?+(+x.value).toFixed(x.dp!=null?x.dp:3):'')});
  const sv=h.querySelector('.fxsolve');if(sv)sv.innerHTML=T?`Working backwards from <b>${esc((num.find(x=>x.k===T.k)||{}).label||T.k)}</b> — solve for <select data-fxu="${i}">${FX.depsOf(F,T.k).all.map(k=>`<option value="${esc(k)}"${k===T.res?' selected':''}>${esc((F.inputs.find(z=>z.k===k)||{}).label||k)}</option>`).join('')}</select>`:'';
  const er=h.querySelector('.fxerr');if(er)er.innerHTML=(note||'')+(r.err?esc(r.err):'')};
 all.forEach((F,i)=>upd(i));
 $('#form').oninput=e=>{const t=e.target;if(cfInput(e))return;
  if(t.dataset.o!=null){const i=+t.dataset.o;if(t.value===''){delete FXT[i];return upd(i)}FXT[i]={k:t.dataset.k,v:+t.value,u:FXT[i]&&FXT[i].k===t.dataset.k?FXT[i].u:''};return upd(i)}
  if(t.dataset.fxu!=null){const i=+t.dataset.fxu;if(FXT[i]){FXT[i].u=t.value;upd(i)}return}
  if(t.dataset.i&&FXT[+t.dataset.i]&&FXT[+t.dataset.i].res===t.dataset.k)delete FXT[+t.dataset.i];
  if(t.dataset.fxf&&FXED){const sec=t.closest('.card'),g=k=>sec.querySelector(`[data-fxf="${k}"]`).value;FXED.F=Object.assign(fxParseLines(FXED.F,g('inputs'),g('out')),{name:g('name'),group:g('group'),doc:g('doc')});const err=FX.check(FXED.F);$('#fxchk').innerHTML=fxChk(err);sec.querySelector('[data-fxs]').disabled=!!err;return}
  if(t.dataset.pre){if(t.value==='')return;const[i,k]=t.dataset.pre.split('-');const inp=$(`#form input[data-i="${i}"][data-k="${k}"]`);if(inp)inp.value=t.value;upd(+i)}
  else if(t.dataset.i){const s=$(`#form select[data-pre="${t.dataset.i}-${t.dataset.k}"]`);if(s)s.value=[...s.options].some(o=>o.value!==''&&+o.value===+t.value)?[...s.options].find(o=>o.value!==''&&+o.value===+t.value).value:'';upd(+t.dataset.i)}};
 $('#form').onchange=$('#form').oninput;
 $('#form').onclick=async e=>{const d=e.target.dataset||{};if(await cfClick(e))return;if(d.fxclr!=null){delete FXT[+d.fxclr];upd(+d.fxclr);return}
  if(d.fxe){FXED={key:d.fxe,F:cloneF(all.find(x=>x.key===d.fxe))};renderForm();const c=document.querySelector('[data-fxf="name"]');if(c)c.closest('.card').scrollIntoView({block:'start'});return}
  if(d.fxx){FXED=null;renderForm();return}
  if(e.target.id==='fx_coll'||e.target.id==='fx_exp'){const o=e.target.id==='fx_exp';$$('#form details[data-fxg]').forEach(x=>x.open=o);FXOPEN=new Set(o?G:[]);return}
  if(e.target.id==='fx_rdo'){const b=e.target;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Restore? Click again';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='Restore default order'}},3000);return}
   if(OFFLINE||!db)return toast('Offline — not saved');const list=(L.formulas||[]).filter(x=>x&&x.key).map(fxNoOrder),og=SETDOC.formulaGroupOrder||[];
   try{await writeLib('formulas',list);L.formulas=list;await db.doc('lib/settings').update({formulaGroupOrder:null});SETDOC.formulaGroupOrder=null;logChange('formulas','(all)','order','custom','default','Formulas','Restore default order'+(og.length?' (groups too)':''));await saveCLOG();renderForm();toast('Default order restored')}catch(x){toast('Save failed: '+(x.message||x.code))}return}
  if(d.fxs&&FXED){const err=FX.check(FXED.F);if(err)return toast(err);const list=FXL().map(F=>F.key===FXED.key?FXED.F:F),old=all.find(x=>x.key===FXED.key);const k=FXED.key;FXED=null;await fxSaveAll(list,'edited',k,JSON.stringify(old.out),JSON.stringify(list.find(x=>x.key===k).out));return}
  if(d.fxr){const seed=FX.SEED.find(x=>x.key===d.fxr),b=e.target;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent=seed?'Reset? Click again':'Delete? Click again';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent=seed?'Reset to default':'Delete'}},3000);return}
   const cur=all.find(x=>x.key===d.fxr),list=seed?FXL().map(F=>F.key===d.fxr?Object.assign(cloneF(seed),F.order!=null&&F.order!==''?{order:F.order}:{}):F):FXL().filter(F=>F.key!==d.fxr);await fxSaveAll(list,seed?'reset to default':'deleted',d.fxr,JSON.stringify(cur.out),seed?JSON.stringify(seed.out):'');return}}}
/* Phase 3b: drag and drop — formula cards within their group (order field in lib/formulas), groups (lib/settings.formulaGroupOrder) */
let FXDRAG=null;
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.fxg&&FXOPEN){if(d.open)FXOPEN.add(d.dataset.fxg);else FXOPEN.delete(d.dataset.fxg)}},true);
document.addEventListener('dragstart',e=>{const d=e.target&&e.target.closest&&(e.target.closest('[data-fxdrag],[data-fxgdrag]')||{}).dataset;if(!d)return;if(d.fxdrag)FXDRAG={card:d.fxdrag};else if(d.fxgdrag)FXDRAG={group:d.fxgdrag};else return;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',d.fxdrag||d.fxgdrag)}catch(x){}});
document.addEventListener('dragover',e=>{if(!FXDRAG)return;const t=FXDRAG.card?e.target.closest&&e.target.closest('#form .card[id^="fc"]'):e.target.closest&&e.target.closest('#form [data-fxgw]');if(t)e.preventDefault()});
document.addEventListener('dragend',()=>{FXDRAG=null});
document.addEventListener('drop',async e=>{if(!FXDRAG)return;const drag=FXDRAG;FXDRAG=null;
 if(drag.card){const t=e.target.closest&&e.target.closest('#form .card[id^="fc"]');if(!t)return;e.preventDefault();const tk=t.querySelector('[data-fxdrag]')&&t.querySelector('[data-fxdrag]').dataset.fxdrag;if(!tk||tk===drag.card)return;await fxMoveCard(drag.card,tk)}
 else{const t=e.target.closest&&e.target.closest('#form [data-fxgw]');if(!t||t.dataset.fxgw===drag.group)return;e.preventDefault();await fxMoveGroup(drag.group,t.dataset.fxgw)}});
async function fxMoveCard(k,before){const all=FXL(),G=FXGROUPS(),a=all.find(F=>F.key===k),b=all.find(F=>F.key===before);if(!a||!b)return;
 if((a.group||G[0])!==(b.group||G[0]))return toast('Formulas can only be moved within their own group');
 if(OFFLINE||!db)return toast('Offline — not saved');const from=all.indexOf(a),to=all.indexOf(b),list=all.slice();list.splice(from,1);list.splice(list.indexOf(b)+(from<to?1:0),0,a);
 /* rows stay in their stored sequence (so Restore default order brings back the original); only the order field changes */
 const st=(L.formulas||[]).filter(x=>x&&x.key),have=new Set(st.map(x=>x.key)),pos={};list.forEach((F,i)=>pos[F.key]=i+1);
 const rows=st.concat(FX.SEED.filter(x=>!have.has(x.key)).map(cloneF)).map(F=>Object.assign({},F,{order:pos[F.key]}));
 try{await writeLib('formulas',rows);L.formulas=rows;logChange('formulas',k,'order',String(from+1),String(rows.findIndex(F=>F.key===k)+1),'Formulas','dragged');await saveCLOG();renderForm()}catch(x){toast('Save failed: '+(x.message||x.code))}}
async function fxMoveGroup(g,before){const G=FXGROUPS(),from=G.indexOf(g),to=G.indexOf(before);if(from<0||to<0)return;if(OFFLINE||!db)return toast('Offline — not saved');
 const list=G.slice();list.splice(from,1);list.splice(list.indexOf(before)+(from<to?1:0),0,g);
 try{await db.doc('lib/settings').update({formulaGroupOrder:list});SETDOC.formulaGroupOrder=list;logChange('formulas',g,'group order',String(from+1),String(list.indexOf(g)+1),'Formulas','dragged');await saveCLOG();renderForm()}catch(x){toast('Save failed: '+(x.message||x.code))}}
document.addEventListener('click',e=>{const j=e.target.dataset?.j;if(!j||j.startsWith('cs-'))return;const el=document.getElementById(j);if(el){const d=el.closest('details');if(d)d.open=true;el.scrollIntoView({behavior:'smooth',block:'start'})}});
