/* ---------- User guide ---------- */
function renderGuide(){$('#guide').innerHTML=`<div class="card"><h2>Live database — one-time set-up</h2><ol>
<li>Open your Google Sheet → <b>Extensions → Apps Script</b>. Delete what is in <code>Code.gs</code> and paste in the file <code>apps-script/Code.gs</code> from the GitHub repo. Save.</li>
<li><b>Deploy → New deployment</b> → gear icon → <b>Web app</b>. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>. Deploy, allow the permissions Google asks for, and copy the <b>Web app URL</b>.</li>
<li>Reload the Sheet. A <b>CNC Shop</b> menu appears → <b>Set write key</b> → choose a key (at least 6 characters).</li>
<li>In the app on the PC with your most up-to-date data: <b>Settings → Live database</b> → paste the URL and the write key → <b>Save &amp; test</b> → reload → <b>Upload this PC’s data</b>.</li>
<li>On every other PC: just open the app. It loads the live data. Type the write key in Settings only on PCs that should be able to save.</li>
<li><b>Profiles:</b> Settings → Profiles → add yourself as an Administrator (2-digit account, 3-digit PIN), then each coworker as Editor or Viewer. They press <b>Sign in</b> at the top. Editors log and change only their own cuts; only administrators can tick Verified.</li></ol>
<p class="mu"><b>When the script file changes</b> (e.g. a new feature): open the Apps Script editor, paste the new <code>apps-script/Code.gs</code> over the old, save, then <b>Deploy → Manage deployments → ✎ Edit → Version: New version → Deploy</b>. The URL stays the same. Don’t press <b>Run</b> in the editor — the functions are called by the app and the Sheet menu, and Run gives errors such as “Cannot call SpreadsheetApp.getUi() from this context”.</p>
<p class="mu">The header chip shows <b>Live</b> when saved, <b>Saving…</b> while sending, <b>Offline — n changes waiting</b> when the database can’t be reached (they are sent automatically later), and <b>View only</b> on a PC without the write key. If another PC saves while you have the app open, the chip offers a reload. Each day a full copy is saved to Google Drive → <i>CNC Shop backups</i> (last 30 kept). The readable Sheet tabs (tools, materials, cycles…) are rewritten automatically whenever the app saves that table — don’t edit them by hand any more; edit in the app.</p></div><div class="card"><h2>Where things are</h2><ul><li><b>Shop floor</b>: Speeds &amp; Feeds, Log cut, Cut database.</li><li><b>Data</b>: <b>Cutting data</b> (Sources, Bands, Baselines, Material limits) · <b>Cycles</b> (Cycle pages, Cycle tree) · <b>Library</b> (tools, materials, holders, machines, tooling audit, change log) · <b>Rules</b> · <b>Formulas</b>.</li><li><b>AI</b>: Ask AI, Learn AI, Prompts (the instructions each AI uses).</li><li><b>App</b>: Settings (API key, Google Sheet, backup / restore), To-do, this guide.</li>
<li><b>Locks</b>: every editing page (Sources, Bands, Baselines, Material limits, Cycle pages, Cycle tree, Rules, Prompts, Library data) opens <b>locked</b> — view only, filters and downloads still work. Press <b>Unlock to edit</b>; when done press <b>Save &amp; lock</b>, which saves anything pending, tidies the rows (numbers rounded the same way, tables sorted) and locks the page again. Saving Rules or Cycle pages with their own Save button locks them too.</li>
<li><b>New materials and cutter types</b> are picked up automatically (at start-up and when you edit the library): they get generic band tables in Bands (catalogue, else typical model — marked <i>Generic (auto)</i>), blank tables in each custom source, and a blank Material limits row marked <i>new · auto</i>. Check them, then download the CSVs for the Sheet.</li></ul></div>
<div class="card"><h2>Speeds &amp; Feeds</h2><ul><li>Every recommendation starts from a <b>band</b> reference (roughing Vc and f/edge at full engagement for a material › cutter type › Ø range) and goes through the same <b>baseline</b> formula: operation ratio, the sub-cycle's Vc × / f/edge ×, chip thinning at light ae, the square / bull-nose factor and the material limits. Sources only differ in where the reference comes from.</li><li><b>Sources</b>: <span class="src BAND">BAND</span> your band tables · <span class="src CUTS">CUTS</span> your <i>Verified</i> cuts, worked back to a reference and averaged (median) · <span class="src MFR">MFR</span> manufacturer catalogue · <span class="src TYP">TYP</span> typical values · <span class="src CUS">custom</span> sources you make. The first enabled source in your order that has data is used; set the order and switch sources on/off in Cutting data → Sources.</li><li>The grid shows a column for every source so you can compare them. In the calculator, the source chips let you force one source; <b>Auto</b> goes back to the order.</li><li><b>Square vs bull nose</b>: end mills, bull-nose and similar tools with a corner radius have their own tables (e.g. BX and BX-R). Bull noses rough harder (f/edge ×1.15 by default); square end mills finish better. The factors are in Cutting data → Baselines.</li><li><b>Drills, reamers and taps</b> have their own band tables with feed per rev (f/rev). Taps feed at the pitch, so the TAP table only holds Vc.</li><li><b>Calculator</b>: change ae or ap and Vc / fz follow. <b>Open in Log cut</b> fills the log form — nothing is saved until you press Save there.</li><li>Hover any value for its full working: reference, source, each factor and limit.</li></ul></div>
<div class="card"><h2>Cutting data</h2><ul><li><b>Sources</b>: order, on/off, and your own sources. <b>New source</b> starts empty or as a copy of the bands, catalogue, typical values or another source; it gets its own band tables and baseline overrides. <b>Copy</b> puts a source on the clipboard, <b>Export</b> saves a .json file, and <b>Paste or import</b> takes either back in (.json, or a bands-style .csv).</li><li><b>Bands</b>: pick the source, material and cutter type, then edit the Ø table. <b>Fill from catalogue</b> seeds an empty table; problems (overlaps, gaps, odd jumps) are flagged. The <b>RPM</b> and <b>Feed</b> columns show the range across each Ø row (from your tools in that range; ≈ = flute count estimated); pick a machine under <b>RPM limit</b> to cap them at its spindle speed.</li>
<li><b>Source look</b>: unlock Sources to give any source its own icon, colour and style (solid, soft, outline); the tags in Speeds &amp; Feeds and the calculator follow.</li>
<li><b>Blank source template</b> (Sources, or Bands): the standard format for a source — every material × cutter × Ø range with Vc and fz empty (CSV), or with every baseline row too (JSON). Fill it in and import it as a new source; empty rows are skipped.</li><li><b>Baselines</b>: one row per sub-cycle — Vc ×, f/edge ×, ap / ae (×Ø) and their max. Pick a custom source to override just some of its rows ('All sub-cycles' changes every row at once). Also holds the square / bull-nose factors and the <b>calculator factors per cycle family</b>: where the light-ae Vc boost starts and how far it goes, Vc and f/edge at a full-width slot, the chip-thinning limit, and how fz eases off at deep ap. Each family has its own built-in values (roughing boosts more and slows down in a full slot; finishing stays gentler); grey = inherited, type to override.</li><li><b>Material limits</b>: each row reads as a sentence ("In 17-4PH, BX, Ø6–12: max stepdown 1×Ø"); choose what it applies to, then fill only the limits you need. Empty fields mean no limit.</li></ul></div>
<div class="card"><h2>Cycles</h2><ul><li><b>Cycle pages</b>: what Log cut shows for each hyperMILL cycle, laid out like its dialog (tabs › boxes › fields). Pick a page, add or remove the cycles it is used for, edit fields (name, control, options, unit) and watch the preview. Press <b>Save</b>; <b>Reset</b> returns to the built-in pages.</li><li><b>Cycle tree</b>: families › operations › sub-cycles as cards. Click a family to open it, click an operation chip to allow / disallow it for a sub-cycle, and use <b>+ Sub-cycle</b> to add one. Anything a logged cut uses cannot be removed, and every change goes to the Change log.</li></ul></div>
<div class="card"><h2>Rules</h2><ul><li>Every rule is <b>When</b> (conditions, all must match) <b>→ Then</b> (actions), with a note and On / Off. Build them with the drop-downs; the sentence above each rule says what it does, and the grey line is the stored form (Sheet <i>rules</i> tab: <code>when, set, note, on</code>).</li>
<li>Conditions: material, material group (ISO), cutter type (BX-R …), tool suffix, corner (square / bull / ball), flutes, operation, cycle family, sub-cycle, Ø band, tool Ø, coolant, machine. <code>a|b</code> = either; <b>is not</b>; numbers take &lt; ≤ &gt; ≥.</li>
<li>Actions: Vc ×, f/edge ×, Vc / f/edge / RPM / feed at most, stepdown / stepover (set or at most), Ra target, coolant, a warning, or block.</li>
<li>Rules apply last, to every source and the calculator; lower rules win for the same field. <b>How rules work</b> on the page has the full reference and examples you can add with one click; <b>Download blank rules template</b> gives the format as a CSV.</li></ul></div>
<div class="card"><h2>Log cut</h2><ul><li>Required: material and tool code. Pick the <b>Sub-cycle</b> (family › operation › sub-cycle) so the cut can feed the CUTS source later; the Ø band is fixed from the tool when you save. A sub-cycle that does not allow the chosen operation is refused.</li><li><b>Suggested start</b> uses the same resolver as Speeds &amp; Feeds and says what it is based on — <b>see them</b> opens those cuts. <b>Use these</b> fills Vc, Fz, ap and ae.</li><li>RPM = Vc×1000 ÷ (π×Ø), Feed = RPM × Fz × flutes, MRR = Feed × DOC × WOC ÷ 1000, all live from the tool's diameter and flutes. The geometry card warns on L/D, DOC beyond the flute length, spindle limit and chip load.</li><li>Choosing a <b>hyperMILL cycle</b> shows that cycle's extra settings. They are saved with the cut and shown in the Cut database and Ask AI.</li><li>Always record the Result, then tick <b>Verified</b> in the Cut database once you trust a cut — only verified Good/Stable/Quick cuts feed recommendations.</li></ul></div>
<div class="card"><h2>Cut database</h2><ul><li><b>Filters</b>: type in the search box, or click a pill (Material, Tool, Type, Family, Sub-cycle, Operation, Band, Machine, Job, Holder, Result, Date) and tick values. Values in one pill widen the list (OR); different pills narrow it (AND). The number beside each value is how many cuts you would see if you added it. Chosen values show as chips — × removes one; <b>Clear all</b> removes everything. Clicking the Date, Material, Tool, Cycle, Sub-cycle or Result column header opens the same filter with sort buttons.</li><li><b>Views ▾</b> applies a built-in view (My BX roughs, All PEEK, Recent failures) or one you saved; saved views stay in this browser.</li><li>The filter is remembered and is in the page address, so a link to the Cut database opens with it. <b>Export CSV</b> exports the filtered rows; the first line records the filter.</li><li>Tick <b>Verified</b> on cuts you trust — only those feed recommendations. Click a <b>Sub-cycle</b> cell to tag or re-tag a cut.</li><li><b>Upload toolpath (POF)</b>: choose hyperMILL .pof files. Decode fills Log cut with the RPM, feed, stepdown, stepover, tool and sub-cycle it was programmed with (14 cycle types so far); add the material and result, then Save — the POF is attached to that cut. Only the parameter part of the file is kept.</li></ul></div>
<div class="card"><h2>Ask AI</h2><ul><li>Ask for parameters: "Rough 17-4PH H1025 with a Ø12 end mill". It searches your logs first, then calls the Speeds &amp; Feeds engine and states each value's source tag.</li><li>It can tell you which hyperMILL cycle settings to fill in, and flags suspect tool geometry.</li><li>Use the Question builder to compose a precise question.</li></ul></div>
<div class="card"><h2>Library</h2><ul><li><b>Data</b>: edit tools, materials, holders and machines. Changes save automatically. Optional <b>Cutting Length (mm)</b> (for slot cutters and saws this is the cutting width) and <b>Flute Length (mm)</b> columns for tools; the geometry card checks DOC against them.</li><li><b>Tooling audit</b>: anomalies in tool geometry found by cross-checking each record. Nothing is changed for you. PH tools (Horn T-slot / groove) are checked against the Horn type number.</li><li><b>Google Sheet</b>: tables listed in the Sheet override the app's copy at start-up. Settings → Google Sheet reloads it; the CSV buttons on Bands and Baselines download a table ready to paste into its tab.</li></ul></div>
<div class="card"><h2>To-do</h2><ul><li>Development reminders and your own action items, saved to the database. Add, tick off and delete; filter Open / Done / All.</li></ul></div>
<div class="card"><h2>Learn AI, Formulas</h2><ul><li>Learn AI: pick a topic or ask; answers end with Learning Resources &amp; Sources; save lessons to the Knowledge Base and search by text or #tag.</li><li>Formulas: categorised calculators with a jump index. Type into any result to work backwards (e.g. Ø and RPM → Vc). The calculator's own formulas and the engine's built-in ones are under <b>Formulas inside the app</b>.</li></ul></div>`}
